version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  auth-backend:
    image: $DOCKER_USERNAME/auth-backend:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpassword
      SERVER_PORT: 8081
    restart: unless-stopped
    depends_on:
      - postgres

  weather-backend:
    image: $DOCKER_USERNAME/weather-backend:latest
    environment:
      SERVER_PORT: 8080
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    restart: unless-stopped
    depends_on:
      - auth-backend

  auth-frontend:
    image: $DOCKER_USERNAME/auth-frontend:latest
    restart: unless-stopped
    depends_on:
      - auth-backend

  weather-frontend:
    image: $DOCKER_USERNAME/weather-frontend:latest
    restart: unless-stopped
    depends_on:
      - weather-backend

  # НОВЫЙ СЕРВИС: weather-notifier
  weather-notifier:
    image: $DOCKER_USERNAME/weather-notifier:latest
    env_file:
      - .env.prod  # или используйте общий .env
    environment:
      # Можно переопределить переменные здесь
      TZ: ${TZ:-Europe/Moscow}
      CHECK_INTERVAL: ${CHECK_INTERVAL:-21600}  # 6 часов в prod
    restart: unless-stopped
    # depends_on не нужен, так как работает автономно
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.getenv('OPENWEATHER_API_KEY') else 1)"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    # Логирование для production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

volumes:
  postgres_data: